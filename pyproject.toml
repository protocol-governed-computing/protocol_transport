[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgc-transport"
version = "5.0.0"
description = "Protocol-Governed Computing — domain-neutral transport boundary engine (canonical contracts, generic resolver, protocol adapters)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

authors = [{ name = "Bhash Ganti", email = "bachipeachy@gmail.com" }]

keywords = [
  "protocol-governed-computing",
  "pgc",
  "transport",
  "ingress",
  "egress",
  "http",
  "gateway"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Topic :: Internet :: WWW/HTTP"
]

dependencies = []

[project.urls]
Homepage = "https://omnibachi.org/"
Repository = "https://github.com/protocol-governed-computing/protocol_transport"

[project.scripts]
pgc_transport = "adapters.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "resolver*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.yaml", "*.json"]
